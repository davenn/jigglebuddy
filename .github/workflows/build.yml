name: Build
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install MinGW-w64
        run: sudo apt-get update -qq && sudo apt-get install -y gcc-mingw-w64-x86-64
      - name: Build
        run: make
      - uses: actions/upload-artifact@v4
        with:
          name: jigglebuddy
          path: jigglebuddy.exe
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: jigglebuddy.exe
